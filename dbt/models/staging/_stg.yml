version: 2

models:
  - name: stg_projects
    description: Staged R&D projects.
    columns:
      - name: project_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['On Track', 'At Risk', 'Delayed']
      - name: priority
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']

  - name: stg_resources
    description: Staged people. resource_id and resource_name are unique across the company.
    columns:
      - name: resource_sk
        data_tests:
          - unique
          - not_null
      - name: resource_id
        data_tests:
          - unique
          - not_null
      - name: resource_name
        data_tests:
          - unique
          - not_null

  - name: stg_task_types
    description: Staged catalog of work types and default teams.
    columns:
      - name: task_type_id
        data_tests:
          - unique
          - not_null

  - name: stg_tasks
    description: Staged project tasks.
    columns:
      - name: task_id
        data_tests:
          - unique
          - not_null
      - name: project_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_projects')
                field: project_id
      - name: task_type_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_task_types')
                field: task_type_id
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Not Started', 'In Progress', 'Done', 'Cancelled']

  - name: stg_allocations
    description: Staged planned resource assignments to tasks. Source completion_date is the task due date.
    columns:
      - name: allocation_sk
        data_tests:
          - unique
          - not_null
      - name: resource_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_resources')
                field: resource_id
      - name: task_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tasks')
                field: task_id
      - name: project_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_projects')
                field: project_id
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Not Started', 'In Progress', 'Done', 'Cancelled']

  - name: stg_time_logs
    description: Staged weekday actual hours by resource, project, and task.
    columns:
      - name: time_log_sk
        data_tests:
          - unique
          - not_null
      - name: resource_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_resources')
                field: resource_id
      - name: task_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tasks')
                field: task_id
      - name: project_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_projects')
                field: project_id

  - name: stg_budgets
    description: Staged planned spend by project and cost category.
    columns:
      - name: budget_sk
        data_tests:
          - unique
          - not_null
      - name: project_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_projects')
                field: project_id
      - name: cost_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Labor', 'External']

  - name: stg_spend
    description: Staged monthly actual spend by project and cost category.
    columns:
      - name: spend_sk
        data_tests:
          - unique
          - not_null
      - name: project_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_projects')
                field: project_id
      - name: cost_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Labor', 'External']

  - name: stg_milestones
    description: >
      Staged project milestones with planned vs actual dates. status is
      derived against today: On Time or Delayed once delivered, Overdue when
      the planned date has passed without delivery, otherwise Upcoming.
    columns:
      - name: milestone_id
        data_tests:
          - unique
          - not_null
      - name: project_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_projects')
                field: project_id
      - name: variance_days
        description: actual_date minus planned_date, in calendar days; null when there is no actual.
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['On Time', 'Delayed', 'Upcoming', 'Overdue']

  - name: stg_kpis
    description: Staged monthly portfolio KPIs. Baseline rows have a null period_date.
    columns:
      - name: kpi_sk
        data_tests:
          - unique
          - not_null
      - name: kpi_short_name
        description: Compact label for charts; full name stays on kpi_name.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'On-Time %'
                  - 'Utilization %'
                  - 'Budget Var %'
                  - 'Cycle Time'
                  - 'Quality %'

  - name: int_project_health
    description: >
      One row per project comparing budget burn with schedule progress, as of
      current_date. Built on staged models so it keeps the live date shift.
      Spend to date counts only spend dated on or before the as-of date.
      burn_gap is pct_budget_spent minus pct_schedule_elapsed; positive means
      spending faster than time is passing.
    columns:
      - name: project_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_projects')
                field: project_id
      - name: reported_status
        description: Status as recorded in the source data, kept for comparison with budget_health.
      - name: spend_to_date
        description: Actual spend dated on or before as_of_date.
        data_tests:
          - not_null
      - name: pct_budget_spent
        description: spend_to_date divided by budget_total.
      - name: pct_schedule_elapsed
        description: Share of the start-to-end window elapsed at as_of_date, capped between 0 and 1.
        data_tests:
          - not_null
      - name: burn_gap
        description: pct_budget_spent minus pct_schedule_elapsed.
      - name: budget_health
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OK', 'Watch', 'Overspending']
      - name: schedule_phase
        data_tests:
          - accepted_values:
              arguments:
                values: ['Not started', 'In flight', 'Past end date']
      - name: milestones_due
        description: Milestones delivered by today or planned before today (still open = overdue).
        data_tests:
          - not_null
      - name: milestones_on_time
        description: Delivered by today, on or before the planned date.
      - name: milestones_delivered_late
        description: Delivered by today, after the planned date.
      - name: milestones_overdue
        description: Not delivered by today, with a planned date before today.
      - name: late_days_total
        description: Sum of days late across milestones_delivered_late; divide by that count for average slip.

  - name: int_kpi_scorecard
    description: >
      Monthly KPI scorecard. One row per KPI and month of a 12-month target year.
      Actuals are calculated from the operational tables on raw dates (so month
      boundaries match how the data was generated), then relabelled forward by
      whole months to line up with the shifted dashboards. Only finished months
      get an actual. Targets come from the kpi_targets seed.
    columns:
      - name: kpi_scorecard_sk
        data_tests:
          - unique
          - not_null
      - name: kpi_short_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['On-Time %', 'Utilization %', 'Budget Var %', 'Cycle Time']
      - name: month
        description: First of the month, shifted to line up with the other dashboards.
        data_tests:
          - not_null
      - name: actual
        description: >
          On-Time %: share of milestones due (planned) that month that were delivered
          on or before plan; undelivered milestones count as misses.
          Utilization %: logged hours / (team weekly capacity x working weeks in the month). Budget Var %: cumulative (planned to date - spent to date) / planned
          to date, negative = over budget. Cycle Time: average working days from start
          to completion for tasks completed that month.
      - name: sample_size
        description: Milestones due or tasks completed in the month (null for budget variance).
      - name: monthly_target
        description: Straight line from baseline to year_goal across the 12 plan months.
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Ahead', 'Behind', 'Over limit']
      - name: progress_to_goal
        description: (actual - baseline) / (year_goal - baseline); 1 = goal reached.
      - name: is_latest_actual
        description: True on each KPI's most recent month with an actual.
